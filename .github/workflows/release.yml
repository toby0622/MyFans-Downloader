name: Release

on:
  push:
    tags:
      - "MFDL*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Build release assets
        shell: pwsh
        run: .\build.ps1

      - name: Run packaged self-test
        shell: pwsh
        run: |
          .\dist\MyFansDownloader.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged self-test failed with exit code $LASTEXITCODE."
          }

      - name: Verify checksum
        shell: pwsh
        run: |
          $expected = (Get-Content .\dist\MyFansDownloader.exe.sha256 -Raw).Trim().Split()[0]
          $actual = (Get-FileHash .\dist\MyFansDownloader.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Release checksum verification failed."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $versionMatches = @(Select-String `
            -Path ".\pyproject.toml" `
            -Pattern '^version = "([^"]+)"$'
          )
          if ($versionMatches.Count -ne 1) {
            throw "Could not determine a unique release version from pyproject.toml."
          }
          $version = $versionMatches[0].Matches[0].Groups[1].Value
          $assets = @(
            ".\dist\MyFansDownloader.exe",
            ".\dist\MyFansDownloader.exe.sha256",
            ".\dist\THIRD_PARTY_LICENSES.zip"
          )
          gh release create $tag $assets `
            --verify-tag `
            --title "v$version" `
            --generate-notes
